name: Build X30E Apple-UI Firmware (ImmortalWrt 21.02)

# 给锐捷 RG-X30E 云编译一版「苹果风格」ImmortalWrt。
#
# 做法：不新建主题、不改模板，只在编译前把 apple.css / apple-dark.css
# 追加到 luci-theme-argon 的 cascade.css / dark.css 末尾（靠源码顺序覆盖，
# 零模板侵入），并用 files/ 覆盖层注入 uci-defaults 把 Argon 主色改成
# Apple 系统蓝、关掉在线壁纸。
#
# 源码：RuijieNetworksCommunity/immortalwrt-mt798x @ openwrt-21.02
# 默认设备：ruijie_rg-x30e-firmware2（与当前在跑的固件同 profile，
#           sysupgrade 保留配置可直升）

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device profile (必须与设备当前 layout 一致)'
        required: true
        default: 'ruijie_rg-x30e-firmware2'
        type: choice
        options:
          - ruijie_rg-x30e-firmware2
          - ruijie_rg-x30e
          - ruijie_rg-x30e-stock
      with_argon_config:
        description: '是否打包 luci-app-argon-config（UI 里可微调主题）'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '0'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-x30e-appleui.yml'
      - 'x30e-apple/**'

concurrency:
  group: x30e-appleui
  cancel-in-progress: false

permissions:
  contents: write

env:
  REPO_URL: https://github.com/RuijieNetworksCommunity/immortalwrt-mt798x.git
  REPO_BRANCH: openwrt-21.02
  BASE_CONFIG: defconfig/mt7981-ax3000.config
  # push 触发时 input 为空 → 走默认；手动 dispatch 时用选择值
  DEVICE: ${{ github.event.inputs.device || 'ruijie_rg-x30e-firmware2' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/lib/jvm /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev file wget \
            subversion patch autoconf automake autopoint binutils cpio device-tree-compiler \
            libelf-dev libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev libmpfr-dev libtool \
            ninja-build p7zip-full pkgconf python3-pip python3-ply python3-docutils qemu-utils \
            re2c squashfs-tools swig texinfo uglifyjs xmlto xxd libreadline-dev ccache curl
          for p in libncurses5-dev libncursesw5-dev genisoimage xorriso haveged intltool lrzsz \
                   antlr3 asciidoc help2man upx-ucl ecj fastjar lib32gcc-s1 libc6-dev-i386; do
            sudo apt-get install -y "$p" >/dev/null 2>&1 || echo "skip: $p"
          done

      - name: Clone source and install feeds
        run: |
          git clone --depth=1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Apple UI skin
        run: |
          cd openwrt
          ARGON=feeds/luci/themes/luci-theme-argon/htdocs/luci-static/argon/css
          test -f "$ARGON/cascade.css" || { echo "::error::argon cascade.css not found — feed layout changed"; exit 1; }
          test -f "$ARGON/dark.css"    || { echo "::error::argon dark.css not found — feed layout changed"; exit 1; }

          echo "--- before ---"
          wc -c "$ARGON/cascade.css" "$ARGON/dark.css"

          cat "$GITHUB_WORKSPACE/x30e-apple/apple.css"      >> "$ARGON/cascade.css"
          cat "$GITHUB_WORKSPACE/x30e-apple/apple-dark.css" >> "$ARGON/dark.css"

          echo "--- after ---"
          wc -c "$ARGON/cascade.css" "$ARGON/dark.css"

          grep -q 'x30e-apple-ui' "$ARGON/cascade.css" || { echo "::error::light skin append failed"; exit 1; }
          grep -q 'x30e-apple-ui' "$ARGON/dark.css"    || { echo "::error::dark skin append failed";  exit 1; }

          mkdir -p files
          cp -a "$GITHUB_WORKSPACE/x30e-apple/files/." files/
          chmod +x files/etc/uci-defaults/99-apple-ui
          echo "--- files overlay ---"
          find files -type f

      - name: Build config
        env:
          WITH_ARGON_CONFIG: ${{ github.event.inputs.with_argon_config || '1' }}
        run: |
          cd openwrt
          cp "$BASE_CONFIG" .config
          # 关掉板级配置里全部 30+ 个 mt7981 设备，只留目标设备，否则磁盘/时间爆掉
          sed -i 's|^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_.*=y$|# disabled|' .config
          {
            echo "CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_${DEVICE}=y"
            echo "CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE_${DEVICE}=\"\""
            echo "CONFIG_PACKAGE_luci-theme-argon=y"
            echo "CONFIG_PACKAGE_luci-app-argon-config=y"
            echo "CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y"
          } >> .config
          make defconfig

          echo "=== selected device ==="
          grep -E '^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_.*=y' .config || true
          echo "=== theme packages ==="
          grep -E '^CONFIG_PACKAGE_luci-(theme-argon|app-argon-config|i18n-argon-config-zh-cn)=' .config || true

          grep -q '^CONFIG_PACKAGE_luci-theme-argon=y' .config \
            || { echo "::error::luci-theme-argon 没进 config"; exit 1; }
          if [ "${WITH_ARGON_CONFIG:-1}" = "1" ]; then
            grep -q '^CONFIG_PACKAGE_luci-app-argon-config=y' .config \
              || { echo "::error::luci-app-argon-config 没进 config（符号不存在？）"; exit 1; }
          fi

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Build firmware
        run: |
          cd openwrt
          echo "Building with $(nproc) threads"
          make -j$(nproc) || make -j1 V=s

      - name: Verify skin inside built rootfs
        run: |
          cd openwrt
          ROOT=$(find build_dir -maxdepth 2 -type d -name 'root-mediatek*' | head -1)
          echo "staged rootfs: ${ROOT:-<not found>}"
          if [ -n "$ROOT" ]; then
            test -f "$ROOT/www/luci-static/argon/css/cascade.css" \
              || { echo "::error::argon cascade.css 没进 rootfs"; exit 1; }
            if grep -q 'x30e-apple-ui' "$ROOT/www/luci-static/argon/css/cascade.css"; then
              echo "OK: 苹果皮肤已进入固件 rootfs"
            else
              echo "::error::rootfs 里的 cascade.css 不含苹果皮肤"; exit 1
            fi
            test -x "$ROOT/etc/uci-defaults/99-apple-ui" \
              && echo "OK: 99-apple-ui 已就位" \
              || { echo "::error::99-apple-ui 缺失或不可执行"; exit 1; }
          else
            echo "::warning::找不到 staging rootfs，跳过深度校验"
          fi
          echo "=== 产物 ==="
          ls -lh bin/targets/mediatek/mt7981/ | head -30

      - name: Collect images
        run: |
          cd openwrt
          mkdir -p /tmp/dist
          find bin/targets/mediatek/mt7981 -maxdepth 1 -type f \
            \( -name "*ruijie_rg-x30e*squashfs-sysupgrade*" -o -name "profiles.json" \) \
            -exec cp -v {} /tmp/dist/ \;
          cd /tmp/dist
          ls -lh
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x30e-appleui-immortalwrt
          path: /tmp/dist/
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: x30e-appleui-${{ github.run_number }}
          name: X30E Apple-UI ImmortalWrt #${{ github.run_number }}
          prerelease: true
          files: /tmp/dist/*
          body: |
            ### 锐捷 RG-X30E · 苹果风格 ImmortalWrt

            源码：`RuijieNetworksCommunity/immortalwrt-mt798x` @ `openwrt-21.02`
            设备：`ruijie_rg-x30e-firmware2`

            改动仅在 UI 层，功能性组件与基线保持一致：

            - `luci-theme-argon` 的 `cascade.css` / `dark.css` 末尾追加苹果设计层
              （SF Pro / 苹方字体栈、iOS 系统色、磨砂玻璃顶栏与侧栏、16px 圆角卡片、
              iOS 分段控件、Apple 蓝 #007AFF 焦点环、亮/暗双主题）
            - 注入 `/etc/uci-defaults/99-apple-ui`：把 Argon 主色设为 #007AFF，
              关掉在线壁纸，升级后自动生效
            - 打包 `luci-app-argon-config`（UI 里可再微调）

            **保留配置升级**（不丢 PPPoE / WiFi / 防火墙）：

            ```
            # 把 .bin 传到路由器 /tmp
            sysupgrade -k /tmp/<本文件>.bin
            ```
            或在 LuCI：系统 → 备份/刷写固件 → 勾选「保留配置」→ 上传。

            刷完刷新页面即可看到新 UI。回退风格（不改固件）：
            ```
            uci set luci.main.mediaurlbase='/luci-static/bootstrap'
            uci commit luci && /etc/init.d/uhttpd restart
            ```
